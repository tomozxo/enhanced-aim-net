<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ENHANCED.aim</title>
<link rel="stylesheet" href="css/styles.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="js/theme-boot.js"></script>
</head>
<body class="gate-body">
  <header class="topbar gate-topbar">
    <div class="mode-toggle">
      <button class="mode-btn" data-mode="light">Light</button>
      <button class="mode-btn" data-mode="dark">Dark</button>
    </div>
  </header>
  <div class="gate-card">
    <div class="gate-icon">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.4"/><circle cx="12" cy="12" r="2.4" fill="currentColor"/><path d="M12 2.5V5M12 19V21.5M2.5 12H5M19 12H21.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </div>
    <h1>enhanced<span class="brand-tld">.aim</span></h1>
    <p class="gate-sub">Enter your license key to continue.</p>

    <input id="keyInput" class="gate-input" type="text" placeholder="R6S-XXXX-XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false" />
    <button id="activateBtn" class="gate-btn">Activate</button>
    <p id="gateMsg" class="gate-msg"></p>

    <p class="gate-footnote">Each key is locked to the browser and PC it's first activated on, and can only be signed in in one place at a time. Switching WiFi is fine. New PC, new browser or cleared cookies? Ask whoever issued your key to reset it.</p>
  </div>

<script src="js/fingerprint.js"></script>
<script src="js/auth-gate.js"></script>
</body>
</html>
