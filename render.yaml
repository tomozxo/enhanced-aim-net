services:
  - type: web
    name: enhanced-aim-net
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Render auto-generates strong random values for these - you never
      # have to come up with or paste in a secret yourself.
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      # Render puts every request through its own proxy first, so the app
      # needs this to read the REAL visitor IP (not Render's proxy IP) -
      # without it, the IP-lock feature breaks. "true" trusts the whole
      # proxy chain rather than guessing an exact hop count, which is the
      # safer setting when that number isn't fixed/documented by the host.
      - key: TRUST_PROXY_HOPS
        value: "true"
